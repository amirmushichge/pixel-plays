<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Frescobol</title>
<style>
  :root { color-scheme: light only; --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --hot: #d9481f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #fff; color: #1c1b19; }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: pointer; outline: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #scores { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 3px; pointer-events: none; color: #1c1b19; }
  #pts { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #combo { color: var(--hot); font-weight: 600; margin-left: 8px; }
  #balls { display: flex; gap: 4px; height: 6px; margin: 3px 0 2px; }
  #balls i { width: 6px; height: 6px; background: #1c1b19; }
  #balls i.gone { background: transparent; box-shadow: inset 0 0 0 1px #b3afa7; }
  #meta { color: var(--muted); }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  #bottom { bottom: max(14px, env(safe-area-inset-bottom)); align-items: flex-end; }
  #status { color: var(--muted); }
  button { pointer-events: auto; font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
  .pop { position: fixed; z-index: 3; pointer-events: none; transform: translate(-50%, -100%); white-space: nowrap; font-weight: 600; color: #1c1b19;
    text-shadow: 1px 0 #fff, -1px 0 #fff, 0 1px #fff, 0 -1px #fff, 1px 1px #fff, -1px -1px #fff; animation: pp-rise .9s ease-out forwards; }
  .pop.perfect { color: var(--hot); }
  .pop.smash { font-size: 15px; }
  @keyframes pp-rise { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: 0 -22px; } }
  @media (prefers-reduced-motion: reduce) { .pop { animation-name: pp-fade; } }
  @keyframes pp-fade { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="A beach. Your partner hits the ball to you; tap, click or press space as the ring closes to hit it back."></canvas></div>
<div id="scores">
  <div><b id="pts">0</b><span id="combo"></span></div>
  <div id="balls"><i></i><i></i><i></i></div>
  <div id="meta"></div>
</div>
<div class="hud" id="bottom">
  <div id="status" role="status" aria-live="polite"></div>
  <button id="mute" type="button" aria-pressed="false">sound on</button>
</div>
<script src="../shell.js"></script>
<script>
PixelPlays.mount({
  id: 'frescobol',
  music: false, // the sea is the soundtrack
  credits: [
    ['Engine by', 'AmirMushich', 'https://x.com/AmirMushich'],
    ['Frescobol by', 'Peter Dirickson', 'https://peterwd.com'],
  ],
  rules: [
    'Frescobol has no opponent. You and your partner keep the ball in the air together for as long as you can.',
    'When the ball comes to you, a ring closes on the spot where it meets your paddle. Tap, click or press space as it closes.',
    'Perfect timing builds your combo up to ×5. A loose hit resets it and sends a wild ball your partner may not reach.',
    'Hold early and release as the ring closes to smash: double points and a faster ball, but your partner may miss it.',
    'The rally speeds up and the wind bends the ball, so watch the flag. Three drops and the session is over.',
  ],
});
</script>
<script>window.PP_SCENE = { originY: 12, shadowX: .75, shadowY: -.5 };</script>
<script src="../engine.js"></script>
<script>
'use strict';

const LAND_X = 15.5, LAND_Y = 10.5, SHORE_Y = -4.3, BAND_Y = SHORE_Y + 1.4, DUNE_X = -10.4;
const PLAY_X = 5.6, REACH_F = 1.05, REACH_S = .45, CONTACT_Z = 1.55, PLANE_X = PLAY_X - REACH_F;
const GRAVITY = 9, BALL_R = .16;
const SLOW_T = 1.35, FAST_T = .62, PACE_HITS = 36, SMASH_K = .62, SERVE_T = 1.45;
const WIN_OK = .15, WIN_GOOD = .085, WIN_PERFECT = .04, TIGHTEN = .78;
const HOLD_SMASH = .2, LOCKOUT = .24, BALLS = 3, COMBO_MAX = 5, RING_SHOW = .95;
const RUN_MAX = 11, WIND_MAX = 2.4, WIND_KMH = 9;
const FLAG_X = 6.5, FLAG_Y = -2.6, FLAG_Z = 3.3;
const TOWEL = { x0: 6.4, y0: 7, x1: 7.8, y1: 9 };
const KIND_SAND = 1, KIND_SEA = 2;
const BEST_KEY = 'pp-frescobol-best';

const ME = { shirt: [238, 204, 52], stripe: [38, 132, 84], legs: [32, 84, 150], hair: [36, 28, 22], skin: [176, 120, 86], paddle: [36, 92, 160] };
const MATE = { shirt: [240, 236, 226], stripe: [206, 70, 56], legs: [44, 44, 56], hair: [120, 72, 40], skin: [222, 170, 132], paddle: [176, 64, 42] };
const LOCAL = { shirt: [110, 178, 188], stripe: [110, 178, 188], legs: [232, 222, 202], hair: [204, 196, 180], skin: [190, 140, 104] };
const GRIP = [64, 52, 44], BALL_COLOR = [250, 112, 64];
const SAND = [[210, 182, 136], [219, 192, 145], [227, 201, 154], [234, 210, 164]];
const WET = [[170, 144, 108], [180, 153, 116], [190, 163, 124], [199, 172, 132]];
const SEA_SHALLOW = [[78, 164, 164], [96, 180, 172], [118, 196, 180]];
const SEA_DEEP = [[36, 98, 128], [44, 114, 140], [54, 130, 150], [66, 146, 160]];
const FOAM = rgb(246, 250, 244), FOAM_SOFT = rgb(212, 234, 226), GLINT = rgb(238, 248, 240);
const HOT = rgb(232, 84, 40), DUST = rgb(240, 222, 186), SPRAY = rgb(226, 242, 238);
const TRUNK = [150, 120, 84], TRUNK_RING = [118, 92, 64];
const FROND = [[58, 104, 54], [86, 136, 64], [122, 162, 78], [176, 170, 96]];

/* ---------- ground ---------- */
const dyn = []; // shore and sea pixels, recoloured as the waves move
function edgeCut(x, y, ix, iy) {
  const edge = Math.pow(Math.pow(Math.abs(x) / LAND_X, 4) + Math.pow(Math.abs(y) / LAND_Y, 4), .25);
  const rough = edge + (noise(x * 1.3, y * 1.3) - .5) * .1;
  if (rough > 1.04) return true;
  return rough > .94 && hash(ix, iy) < (rough - .94) / .1;
}
function sandColor(x, y, ix, iy) {
  const fine = hash(ix, iy);
  if (fine > .993) return rgb(248, 242, 228); // shell fragments
  if (fine < .004) return rgb(150, 128, 100);
  const ripple = Math.sin(x * .9 + y * 1.7 + noise(x * .35, y * .35) * 5) * .07;
  const v = .5 + (noise(x * .55, y * .6) - .5) * .55 + ripple;
  const k = clamp(Math.floor(v * 4 + (bayerAt(ix, iy) - .5) * .6), 0, 3);
  // the sand darkens towards the waterline in a few dithered steps
  const wet = Math.floor(clamp(1 - (y - SHORE_Y) / 3.4, 0, 1) * 3 + bayerAt(ix + 2, iy + 1) * .99) / 3;
  const a = SAND[k], b = WET[k];
  return rgb(lerp(a[0], b[0], wet), lerp(a[1], b[1], wet), lerp(a[2], b[2], wet));
}
function groundColor(x, y, ix, iy, i) {
  if (edgeCut(x, y, ix, iy)) return 0;
  if (y < BAND_Y) {
    kinds[i] = KIND_SEA;
    const dry = sandColor(x, y, ix, iy);
    dyn.push({ i, x, y, ix, iy, dry });
    return dry; // repainted by paintSea once the bake is done
  }
  if (x >= TOWEL.x0 && x <= TOWEL.x1 && y >= TOWEL.y0 && y <= TOWEL.y1) {
    kinds[i] = KIND_SAND;
    const stripe = Math.floor((y - TOWEL.y0) / .4) % 2, fringe = y - TOWEL.y0 < .08 || TOWEL.y1 - y < .08;
    if (fringe && hash(ix, iy) > .4) return rgb(244, 238, 222);
    return rampOf(stripe ? [46, 140, 84] : [246, 204, 46])[hash(ix, iy) > .85 ? 2 : 3];
  }
  const dune = x < DUNE_X + (noise(x * .4, y * .4) - .5) * 2.4 && y > -1.5;
  kinds[i] = dune ? KIND_GRASS : KIND_SAND;
  return sandColor(x, y, ix, iy);
}
function waterline(x, t) {
  return SHORE_Y + Math.sin(t * .5) * .55 + Math.sin(t * 1.25 + x * .23) * .16 + (noise(x * .3 + 9, t * .15) - .5) * .7;
}
function shadeOf(c, s) {
  const k = s === 1 ? [.54, .52, .72] : [.36, .34, .56];
  return rgb((c & 255) * k[0], (c >> 8 & 255) * k[1], (c >> 16 & 255) * k[2]);
}
function paintSea(t) {
  for (const d of dyn) {
    const line = waterline(d.x, t), depth = line - d.y;
    let c;
    if (depth > .2 + noise(d.x * 2, t * 2) * .15) {
      if (depth < 1.6) {
        const v = .5 + (noise(d.x * .8 + t * .4, d.y * 1.6) - .5) * .7 - depth * .15;
        c = rgb(...SEA_SHALLOW[clamp(Math.floor(v * 3 + (bayerAt(d.ix, d.iy) - .5) * .6), 0, 2)]);
      } else {
        const v = .75 - Math.min(1, (depth - 1.6) / 5) * .6 + (noise(d.x * .5 - t * .2, d.y * 1.2 + t * .1) - .5) * .5;
        c = rgb(...SEA_DEEP[clamp(Math.floor(v * 4 + (bayerAt(d.ix, d.iy) - .5) * .6), 0, 3)]);
      }
      // the soft line of the next wave, and sun glints
      const crest = Math.sin(d.y * 2.2 - t * 1.6 + noise(d.x * .4, d.y * .4) * 4);
      if (depth > 1 && crest > .985) c = FOAM_SOFT;
      else if (noise(d.x * 2.6 + t * .9, d.y * 5 - t * .4) > .84 && hash(d.ix, d.iy) > .5) c = GLINT;
    } else if (depth > 0) {
      c = hash(d.ix + (t * 8 | 0), d.iy) > .25 ? FOAM : FOAM_SOFT;
    } else if (depth > -.35) {
      const p = d.dry; // freshly wet sand shines darker
      c = rgb((p & 255) * .84, (p >> 8 & 255) * .84, (p >> 16 & 255) * .86);
    } else c = d.dry;
    const s = staticShadow[d.i];
    if (s) c = shadeOf(c, s);
    if (bakedZ[d.i] === groundZ[d.i]) bakedPix[d.i] = c;
  }
}
function markSand(x, y) {
  const p = project(x, y, 0), ix = p.sx | 0, iy = p.sy | 0;
  for (let dx = 0; dx <= 1; dx++) {
    const jx = ix + dx;
    if (jx < 0 || iy < 0 || jx >= W || iy >= H) continue;
    const i = iy * W + jx;
    if (kinds[i] !== KIND_SAND || bakedZ[i] !== groundZ[i] || bakedPix[i] !== pristinePix[i]) continue;
    const c = bakedPix[i];
    bakedPix[i] = rgb((c & 255) * .88, (c >> 8 & 255) * .86, (c >> 16 & 255) * .86);
  }
}

/* ---------- props ---------- */
function growPalm(x, y, h, bend, dir, seed) {
  const N = 16, pts = [];
  for (let k = 0; k <= N; k++) {
    const t = k / N, off = bend * t * t;
    pts.push([x + Math.cos(dir) * off, y + Math.sin(dir) * off, t * h]);
  }
  const bark = z => (Math.floor(z * 3.6) % 2 ? TRUNK : TRUNK_RING);
  for (let k = 0; k < N; k++) capsule(pts[k], pts[k + 1], lerp(.3, .16, k / N), lerp(.3, .16, (k + 1) / N), bark, 'rough');
  for (let k = 0; k <= N; k += 2) castShadow(pts[k][0], pts[k][1], pts[k][2], .26);
  const [tx, ty, tz] = pts[N];
  for (let c = 0; c < 3; c++) sphere(tx + Math.cos(c * 2.1 + seed) * .2, ty + Math.sin(c * 2.1 + seed) * .2, tz - .22, .15, [104, 84, 46], 'solid');
  const fronds = 9;
  for (let f = 0; f < fronds; f++) {
    const a = f / fronds * 6.283 + hash(seed, f) * .5, len = 2.2 + hash(seed + 1, f) * .8;
    const droop = 1.5 + hash(seed + 2, f) * .7, lift = .7 + hash(seed + 3, f) * .4, ca = Math.cos(a), sa = Math.sin(a);
    capture = [];
    let mid = null;
    for (let s = 1; s <= 14; s++) {
      const t = s / 14, r = len * t, z = tz + lift * t - droop * t * t;
      const px = tx + ca * r, py = ty + sa * r, w = .38 * Math.sin(Math.PI * Math.min(1, t * 1.2));
      sphere(px, py, z, .09, FROND[0], 'solid');
      for (const side of [-1, 1]) {
        const tone = t > .82 ? FROND[3] : (s + side + f) % 3 ? FROND[2] : FROND[1];
        sphere(px - sa * w * side, py + ca * w * side, z - .12 - w * .25, .12, tone, 'rough');
      }
      if (s === 7) mid = [px, py, z];
      castShadow(px, py, z, .3 + w * .75, 1, .25);
    }
    // one leaf entry per frond, so each frond sways as a single piece
    leaves.push({ x: mid[0], y: mid[1], z: mid[2], k: f * 2 + 1, r: .5, pixels: capture });
    capture = null;
  }
}
function umbrella(cx, cy, h, R) {
  capsule([cx, cy, 0], [cx, cy, h + .12], .05, .05, () => [206, 202, 192], 'solid');
  for (let z = 0; z < h; z += .12) castShadow(cx, cy, z, .08, 1, 0);
  const red = rampOf([214, 64, 52]), white = rampOf([244, 238, 224]);
  const L = [-.55, .37, .74], nl = Math.hypot(.4, 1);
  for (let r = 0; r <= R; r += .033) {
    const n = Math.max(6, Math.ceil(6.283 * r / .033));
    for (let k = 0; k < n; k++) {
      const a = k / n * 6.283, ca = Math.cos(a), sa = Math.sin(a);
      const x = cx + ca * r, y = cy + sa * r, z = h + .25 - r * .4;
      const l = clamp((ca * .4 * L[0] + sa * .4 * L[1] + L[2]) / nl, 0, 1);
      const p = project(x, y, z), ramp = Math.floor(a / 6.283 * 10) % 2 ? red : white;
      plot(x, y, z, ramp[clamp(Math.floor(l * 3.4 + .9 + (bayerAt(p.sx | 0, p.sy | 0) - .5) * .6), 0, 4)]);
    }
  }
  castShadow(cx, cy, h - .05, R * .95);
}
function chair(x, y, color) {
  const frame = [206, 206, 200];
  for (const [dx, dy] of [[0, 0], [.64, 0], [0, .9], [.64, .9]]) box(x + dx, y + dy, 0, x + dx + .06, y + dy + .06, .36, frame, 2);
  box(x, y, .34, x + .7, y + .96, .4, color, 5);
  for (let k = 0; k < 7; k++) box(x, y + .9 + k * .07, .4 + k * .13, x + .7, y + .98 + k * .07, .53 + k * .13, color, 6 + k);
  for (let k = 0; k < 4; k++) castShadow(x + .35, y + .25 * k + .1, .4, .42);
  for (let k = 0; k < 4; k++) castShadow(x + .35, y + 1 + k * .1, .6 + k * .25, .38);
}
function props() {
  growPalm(-12.2, 2.6, 5.6, 1.4, .25, 11);
  growPalm(-10.4, 7.4, 4.7, 1.1, -.6, 37);
  growPalm(12.8, -2.4, 5.2, 1.3, .3, 73);
  umbrella(2.3, 7, 2.7, 1.85);
  chair(3.1, 4.9, [44, 120, 170]);
  chair(4.2, 5.2, [236, 120, 60]);

  // cooler with a coconut on the lid
  box(-1.5, 7.2, 0, -.8, 7.7, .5, [40, 110, 190], 21);
  box(-1.53, 7.17, .5, -.77, 7.73, .58, [240, 240, 236], 22);
  castShadow(-1.15, 7.45, .3, .5);
  sphere(-1.1, 7.45, .74, .17, [112, 150, 62], 'rough');
  capsule([-1.08, 7.45, .86], [-1.0, 7.4, 1.1], .025, .025, () => [240, 240, 232], 'solid');

  // sandcastle
  const castle = [214, 186, 140];
  box(-4.6, 6.2, 0, -3.6, 7.2, .35, castle, 31);
  for (const [dx, dy] of [[0, 0], [.74, 0], [0, .74], [.74, .74]]) box(-4.6 + dx, 6.2 + dy, .35, -4.34 + dx, 6.46 + dy, .7, castle, 32);
  box(-4.3, 6.5, .35, -3.9, 6.9, 1, castle, 33);
  capsule([-4.1, 6.7, 1], [-4.1, 6.7, 1.35], .02, .02, () => [120, 100, 80], 'solid');
  for (let z = .1; z < .32; z += .07) plot(-4.06, 6.7, 1.35 - z * .4, rgb(214, 52, 44));
  castShadow(-4.1, 6.7, .5, .7);

  // surfboard stuck in the sand
  box(-8.25, 4.2, 0, -8.1, 4.85, 2.3, [248, 210, 70], 41);
  box(-8.26, 4.47, 0, -8.09, 4.58, 2.3, [214, 64, 52], 42);
  for (let z = .2; z < 2.3; z += .3) castShadow(-8.18, 4.52, z, .3);

  // flip-flops beside the towel
  box(6.0, 8.2, 0, 6.12, 8.5, .04, [40, 120, 170], 51);
  box(6.2, 8.25, 0, 6.32, 8.55, .04, [40, 120, 170], 52);

  // lifeguard flag pole; the flag itself is drawn every frame
  box(FLAG_X - .05, FLAG_Y - .05, 0, FLAG_X + .05, FLAG_Y + .05, FLAG_Z, [214, 214, 208], 61);
  for (let z = .1; z < FLAG_Z; z += .12) castShadow(FLAG_X, FLAG_Y, z, .1, 1, 0);
}
function bake() {
  zb.fill(-1e9);
  pix.fill(rgb(255, 255, 255));
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = groundColor(g.x, g.y, ix, iy, i);
    if (!c) continue;
    pix[i] = c; ground[i] = 1;
    zb[i] = (g.x + g.y) / R2 * COS;
  }
  growGrass();
  groundZ.set(zb);
  props();
  bakeOcclusion();
  staticShadow.set(shadowMask);
  applyShadows(groundZ);
  bakedPix.set(pix);
  bakedZ.set(zb);
  paintSea(0);
  pristinePix.set(bakedPix);
}
const pristinePix = new Uint32Array(W * H);

/* ---------- game state ---------- */
const G = {
  phase: 'ready', time: 0, timer: 0, score: 0, best: 0, combo: 1, balls: BALLS, rally: 0, myHits: 0, longest: 0, firstRally: true,
  ball: null, hold: null, lockout: 0, whiff: -9, spark: 0, sparkAt: null, dust: [], streaks: [], cheer: 0, status: '', meta: '',
  wind: { x: 0, y: 0 }, windBase: { x: 0, y: .6 }, windNow: { x: 0, y: .6 },
  who: [
    { x: PLAY_X, y: 0, dir: Math.PI, swing: -1, smash: false, moved: 0, lunge: 0, step: 0 },
    { x: -PLAY_X, y: 0, dir: 0, swing: -1, smash: false, moved: 0, lunge: 0, step: 0, fail: false },
  ],
};
try { G.best = +localStorage.getItem(BEST_KEY) || 0; } catch { G.best = 0; }

const nodes = {
  pts: document.getElementById('pts'), combo: document.getElementById('combo'),
  balls: [...document.querySelectorAll('#balls i')], meta: document.getElementById('meta'), status: document.getElementById('status'),
};
function renderHud() {
  nodes.pts.textContent = G.score;
  nodes.combo.textContent = G.combo > 1 ? '×' + G.combo : '';
  nodes.balls.forEach((n, k) => n.classList.toggle('gone', k >= G.balls));
}
function windLabel() {
  const w = G.windNow, s = Math.hypot(w.x, w.y);
  const du = (w.x - w.y) / R2, dv = (w.x + w.y) / R2 * SIN;
  const k = Math.round(Math.atan2(dv, du) / (Math.PI / 4));
  return 'wind ' + Math.round(s * WIND_KMH) + ' km/h ' + ['→', '↘', '↓', '↙', '←', '↖', '↑', '↗'][(k + 8) % 8];
}
function renderMeta() {
  const text = (G.best ? 'best ' + G.best + ' · ' : '') + windLabel();
  if (text !== G.meta) { G.meta = text; nodes.meta.textContent = text; }
}
function setStatus(text) {
  if (text === G.status) return;
  G.status = text;
  nodes.status.textContent = text;
}
const pace = () => clamp(G.rally / PACE_HITS, 0, 1);
// past full pace the squeeze keeps going slowly, so even a flawless rally ends eventually
const overtime = () => clamp((G.rally - PACE_HITS) / 90, 0, 1);
const tightness = () => lerp(1, TIGHTEN, pace()) * (1 - .3 * overtime());
const flightT = () => lerp(SLOW_T, FAST_T, pace()) * (1 - .18 * overtime());
const okWindow = () => WIN_OK * tightness();
const charged = () => G.hold && G.time - G.hold.t0 >= HOLD_SMASH && G.phase === 'rally';
function pop(text, cls, x, y, z) {
  const p = project(x, y, z), r = canvas.getBoundingClientRect(), k = r.width / W;
  const el = document.createElement('div');
  el.className = 'pop ' + cls;
  el.textContent = text;
  el.style.left = r.left + p.sx * k + 'px';
  el.style.top = r.top + p.sy * k + 'px';
  document.body.append(el);
  setTimeout(() => el.remove(), 950);
}

/* ---------- wind ---------- */
function newWind() {
  const strength = WIND_MAX * Math.min(1, .12 + Math.random() * (.3 + .55 * pace()) + .3 * overtime());
  const a = Math.PI / 2 + (Math.random() - .5) * 2.4; // mostly an onshore sea breeze
  G.windBase = { x: Math.cos(a) * strength, y: Math.sin(a) * strength };
}
function stepWind(dt) {
  const k = Math.min(1, dt * .6), w = G.windNow;

});
canvas.addEventListener('keyup', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  e.preventDefault();
  release();
});
addEventListener('blur', () => { G.hold = null; });

/* ---------- sound ---------- */
let audio = null, master = null, muted = false, noiseBuffer = null;
function ensureAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio = new AC();
  master = audio.createGain();
  master.gain.value = muted ? 0 : 1;
  master.connect(audio.destination);
  noiseBuffer = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  // surf: looping noise through a low-pass, swelling slowly like waves arriving
  const surf = audio.createBufferSource(), low = audio.createBiquadFilter(), swell = audio.createGain();
  const lfo = audio.createOscillator(), depth = audio.createGain();
  surf.buffer = noiseBuffer; surf.loop = true;
  low.type = 'lowpass'; low.frequency.value = 620;
  swell.gain.value = .05;
  lfo.frequency.value = .09; depth.gain.value = .035;
  lfo.connect(depth).connect(swell.gain);
  surf.connect(low).connect(swell).connect(master);
  surf.start(); lfo.start();
}
function burst(at, length, level, freq, type = 'bandpass') {
  const src = audio.createBufferSource(), gain = audio.createGain(), filter = audio.createBiquadFilter();
  src.buffer = noiseBuffer;
  filter.type = type; filter.frequency.value = freq; filter.Q.value = .8;
  gain.gain.setValueAtTime(level, at);
  gain.gain.exponentialRampToValueAtTime(.0005, at + length);
  src.connect(filter).connect(gain).connect(master);
  src.start(at, Math.random()); src.stop(at + length + .01);
}
function tone(at, from, to, length, level, type) {
  const gain = audio.createGain(), osc = audio.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(from, at);
  osc.frequency.exponentialRampToValueAtTime(to, at + length);
  gain.gain.setValueAtTime(level, at);
  gain.gain.exponentialRampToValueAtTime(.0005, at + length);
  osc.connect(gain).connect(master);
  osc.start(at); osc.stop(at + length + .01);
}
function sound(kind, amount = .6) {
  if (!audio) return;
  const now = audio.currentTime;
  if (kind === 'hit') { burst(now, .025, .14, 3400); tone(now, 1050, 460, .05, .12 + amount * .1, 'square'); }
  else if (kind === 'smash') { burst(now, .04, .22, 2600); tone(now, 820, 240, .09, .3, 'square'); }
  else if (kind === 'ping') tone(now + .03, 1180 + amount * 120, 1180 + amount * 120, .09, .05, 'triangle');
  else if (kind === 'whiff') burst(now, .09, .05, 900);
  else if (kind === 'thud') { burst(now, .08, .18, 400, 'lowpass'); tone(now, 140, 60, .12, .2, 'sine'); }
  else if (kind === 'splash') { burst(now, .25, .12, 1800); burst(now + .04, .2, .08, 900); }
  else if (kind === 'drop') { tone(now + .05, 520, 330, .14, .06, 'triangle'); tone(now + .2, 390, 250, .2, .06, 'triangle'); }
}
const muteButton = document.getElementById('mute');
muteButton.addEventListener('click', () => {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 1;
  muteButton.textContent = muted ? 'sound off' : 'sound on';
  muteButton.setAttribute('aria-pressed', String(muted));
});

/* ---------- boot ---------- */
addEventListener('resize', fit);
fit();
bake();
newWind();
G.windNow = { ...G.windBase };
renderHud();
setStatus('tap to start');
let last = performance.now();
function frame(now) {
  update(Math.min(.04, (now - last) / 1000));
  last = now;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__frescobol = { G, press, release, contactError, step(dt, skipDraw) { update(dt); if (!skipDraw) draw(); } };
</script>
</body>
